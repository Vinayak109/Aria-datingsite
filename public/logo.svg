<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ariaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background pill circle -->
  <rect width="100" height="100" rx="28" fill="#0A0A0A" />
  <rect x="2" y="2" width="96" height="96" rx="26" stroke="url(#ariaGrad)" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="50" cy="50" r="32" fill="url(#ariaGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Heart Base Shape -->
  <path d="M50 78 C32 63 18 50 18 34 C18 21 28 14 40 14 C46 14 50 17 50 20 C50 17 54 14 60 14 C72 14 82 21 82 34 C82 50 68 63 50 78 Z" 
        fill="url(#ariaGrad)" filter="url(#glow)" />
        
  <!-- Voice Waveform Overlay Across Heart -->
  <g stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="36" x2="32" y2="44" />
    <line x1="38" y1="31" x2="38" y2="49" />
    <line x1="44" y1="26" x2="44" y2="54" />
    <line x1="50" y1="22" x2="50" y2="58" />
    <line x1="56" y1="26" x2="56" y2="54" />
    <line x1="62" y1="31" x2="62" y2="49" />
    <line x1="68" y1="36" x2="68" y2="44" />
  </g>
</svg>
